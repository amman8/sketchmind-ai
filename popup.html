<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SketchMind AI</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="popup-container">

      <!-- Header -->
      <header class="popup-header">
        <div class="logo">
          <svg class="logo-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25z" fill="currentColor"/>
            <path d="M20.71 7.04a1 1 0 0 0 0-1.41l-2.34-2.34a1 1 0 0 0-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z" fill="currentColor" opacity="0.6"/>
          </svg>
          <span class="logo-text">SketchMind <span class="logo-ai">AI</span></span>
        </div>
        <span class="version-badge">v0.2.0</span>
      </header>

      <!-- Status bar -->
      <div class="status-bar" id="statusBar">
        <span class="status-dot" id="statusDot"></span>
        <span class="status-text" id="statusText">Ready</span>
      </div>

      <!-- Main actions -->
      <main class="popup-main">
        <section class="action-section">
          <!-- Primary: toggle drawing mode -->
          <button class="btn btn-primary" id="toggleDrawBtn" aria-pressed="false">
            <svg class="btn-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25z" fill="currentColor"/>
              <path d="M20.71 7.04a1 1 0 0 0 0-1.41l-2.34-2.34a1 1 0 0 0-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z" fill="currentColor" opacity="0.7"/>
            </svg>
            <span id="toggleDrawLabel">Enable Drawing Mode</span>
          </button>

          <!-- Secondary: open explanation panel -->
          <button class="btn btn-secondary" id="openExplainBtn">
            <svg class="btn-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2"/>
              <path d="M12 16v-4M12 8h.01" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
            <span>Open Explanation Panel</span>
          </button>
        </section>

        <!-- Drawing tools (visible only when drawing mode is active) -->
        <section class="tools-section hidden" id="toolsSection" aria-label="Drawing tools">
          <p class="tools-label">Tools</p>
          <div class="tools-row">
            <button class="tool-btn active" data-tool="pen" title="Pen" aria-pressed="true" aria-label="Pen tool">
              <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25z" fill="currentColor"/>
                <path d="M20.71 7.04a1 1 0 0 0 0-1.41l-2.34-2.34a1 1 0 0 0-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z" fill="currentColor" opacity="0.6"/>
              </svg>
            </button>
            <button class="tool-btn" data-tool="highlight" title="Highlighter" aria-pressed="false" aria-label="Highlighter tool">
              <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <rect x="3" y="13" width="18" height="6" rx="1" fill="currentColor" opacity="0.45"/>
                <path d="M8 13V6l4-2 4 2v7" stroke="currentColor" stroke-width="2" fill="none"/>
              </svg>
            </button>
            <button class="tool-btn" data-tool="eraser" title="Eraser" aria-pressed="false" aria-label="Eraser tool">
              <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <path d="M20 20H7L3 16l10-10 7 7-3.5 3.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>
            <button class="tool-btn" data-tool="clear" title="Clear all" aria-label="Clear all drawings">
              <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>
          </div>

          <!-- Pen width -->
          <div class="width-row">
            <label class="tools-label" for="widthSlider">Width</label>
            <div class="width-control">
              <input
                type="range"
                id="widthSlider"
                class="width-slider"
                min="1"
                max="32"
                value="4"
                step="1"
                aria-label="Pen width"
              />
              <span class="width-value" id="widthValue">4px</span>
            </div>
          </div>

          <!-- Color palette -->
          <div class="color-row" aria-label="Stroke color">
            <button class="color-btn active" data-color="#ef4444" style="background:#ef4444" title="Red"    aria-label="Red"    aria-pressed="true"></button>
            <button class="color-btn"        data-color="#f97316" style="background:#f97316" title="Orange" aria-label="Orange" aria-pressed="false"></button>
            <button class="color-btn"        data-color="#eab308" style="background:#eab308" title="Yellow" aria-label="Yellow" aria-pressed="false"></button>
            <button class="color-btn"        data-color="#22c55e" style="background:#22c55e" title="Green"  aria-label="Green"  aria-pressed="false"></button>
            <button class="color-btn"        data-color="#3b82f6" style="background:#3b82f6" title="Blue"   aria-label="Blue"   aria-pressed="false"></button>
            <button class="color-btn"        data-color="#a855f7" style="background:#a855f7" title="Purple" aria-label="Purple" aria-pressed="false"></button>
            <button class="color-btn"        data-color="#ffffff" style="background:#ffffff;border-color:rgba(255,255,255,.3)" title="White"  aria-label="White"  aria-pressed="false"></button>
            <button class="color-btn"        data-color="#1e293b" style="background:#1e293b" title="Dark"   aria-label="Dark"   aria-pressed="false"></button>
          </div>

          <!-- Keyboard hint -->
          <p class="keyboard-hint">
            <kbd>P</kbd> Pen &nbsp; <kbd>H</kbd> Highlight &nbsp; <kbd>E</kbd> Eraser &nbsp; <kbd>Esc</kbd> Exit
          </p>
        </section>
      </main>

      <!-- Footer -->
      <footer class="popup-footer">
        <a class="footer-link" href="https://github.com/amman8/sketchmind-ai" target="_blank" rel="noopener noreferrer">GitHub</a>
        <span class="footer-sep">·</span>
        <span class="footer-note">Milestone 2 — Drawing Overlay</span>
      </footer>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
